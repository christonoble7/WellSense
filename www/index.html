<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2540"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<title>WellSense</title>
<style>
:root{--bg:#f2f6fa;--card:#fff;--tx:#0b2540;--mu:#5b6f84;--pr:#0f9d8f;--nv:#0b2540;--bd:#dbe4ee;--ok:#16a34a;--wa:#d97706;--er:#dc2626;--sh:0 4px 14px rgba(11,37,64,.08)}
[data-t=d]{--bg:#081a2e;--card:#0f2a47;--tx:#e8f0f8;--mu:#93a8bd;--bd:#1d3d5f;--pr:#2dd4bf;--sh:0 4px 14px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:430px;margin:auto;min-height:100vh;position:relative}
main{padding:calc(12px + env(safe-area-inset-top)) 14px 96px;animation:f .25s}
@keyframes f{from{opacity:0;transform:translateY(6px)}}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
.c{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.hd{background:linear-gradient(135deg,#0b2540,#0f9d8f);color:#fff}
.r{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.w{flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mu{color:var(--mu);font-size:13px}.big{font-size:30px;font-weight:700}
button,.b{min-height:46px;border:0;border-radius:12px;background:var(--pr);color:#fff;font:600 15px inherit;padding:0 16px;cursor:pointer}
button.s{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}button.d{background:var(--er)}button.sm{min-height:36px;padding:0 10px;font-size:13px}
button.full{width:100%;margin-top:8px}
label{display:block;font-size:12px;color:var(--mu);margin:6px 0 2px}
input,select{width:100%;min-height:44px;border:1.5px solid var(--bd);border-radius:10px;padding:0 10px;font:inherit;background:var(--card);color:var(--tx)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.ok{background:var(--ok)}.wa{background:var(--wa)}.er{background:var(--er)}
.al{border-left:4px solid var(--wa);padding:8px 10px;margin:6px 0;background:rgba(217,119,6,.1);border-radius:8px;font-size:13px}
.li{padding:10px;border-bottom:1px solid var(--bd);cursor:pointer}
.em{text-align:center;color:var(--mu);padding:18px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav a{flex:1;text-align:center;padding:8px 0;font-size:11px;color:var(--mu);cursor:pointer}nav a span{display:block;font-size:20px}nav a.on{color:var(--pr);font-weight:700}
.mood{font-size:30px;background:none;color:inherit;padding:0;min-height:48px;border-radius:12px;flex:1}.mood.on{background:var(--pr)}
.tabs button{flex:1;min-height:36px;font-size:13px}
.err{color:var(--er);font-size:13px;min-height:16px}
svg text{fill:var(--mu);font-size:10px}
@media print{nav,.np{display:none!important}body{background:#fff}.c{box-shadow:none;border:1px solid #ccc}}
</style></head><body><div id="app"></div>
<script src="model-data.js"></script>
<script>
/* ===== WellSense: on-device, explainable wellness scoring. No backend. ===== */
const $=s=>document.querySelector(s),K='wellsense1';
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)),avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const has=v=>v!=null&&v!==''&&!isNaN(v),num=id=>{const v=$('#'+id)?.value;return v===''||v==null?null:+v};
const dstr=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)},today=()=>dstr(0);
const rnd=(a,b)=>Math.round(a+Math.random()*(b-a));
let S=null,tab='home',locked=false,sel=null,msg='',bodyRange=7,bodyKey='rhr',pinBuf='';
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Storage full or blocked')}};
const blank=p=>({p,pin:null,dark:false,units:'metric',usdaKey:'',usda:{},demo:false,food:[],body:[],blood:[],mind:[]});

/* ---- Food database per 100 g: name,kcal,carb,protein,fat,sugar,sodium(mg),gPerPiece,gPerCup ---- */
const FOODS=[['Roti (chapati)',297,46,9,7,1,320,40],['Steamed rice',130,28,2.7,.3,0,1,0,160],['Brown rice',123,26,2.7,1,0,4,0,160],['Idli',130,27,4,.4,1,200,40],['Plain dosa',168,29,4,3.7,1,250,80],['Dal (cooked)',116,20,7,.4,1,240,0,200],['Rajma curry',127,22,8,.5,2,200,0,200],['Chole (chickpea curry)',164,27,9,2.6,5,250,0,200],['Paneer',265,1.2,18,21,1,18,25],['Curd (dahi)',61,4.7,3.5,3.3,4.7,46,0,245],['Milk (whole)',61,4.8,3.2,3.3,5,43,0,240],['Egg (boiled)',155,1.1,13,11,1.1,124,50],['Chicken curry',150,5,15,7,2,350,0,200],['Fish curry',120,4,14,5,1,300,0,200],['Sambar',60,9,3,1.5,3,320,0,200],['Poha',130,25,2.6,2.5,1,220,0,180],['Upma',120,18,3,4,1,300,0,200],['Aloo paratha',260,36,6,10,2,380,80],['Biryani (chicken)',180,22,9,6,1,420,0,200],['Banana',89,23,1.1,.3,12,1,120],['Apple',52,14,.3,.2,10,1,180],['Mango',60,15,.8,.4,14,1,200],['Papaya',43,11,.5,.3,8,8,0,150],['Almonds',579,22,21,50,4,1,1.2],['Peanuts',567,16,26,49,4,18,0.8],['Oats (cooked)',71,12,2.5,1.5,0,49,0,240],['Bread (white)',265,49,9,3.2,5,491,30],['Samosa',262,24,3.5,17,2,420,60],['Gulab jamun',300,45,5,12,38,60,40],['Tea with milk & sugar',45,7,1.2,1.3,6.5,18,0,240],['Coffee (black)',2,0,.3,0,0,2,0,240],['Cooked spinach',23,3.6,3,.3,.4,70,0,180],['Salad (mixed veg)',20,4,1,.2,2,15,0,100],['Olive/cooking oil',884,0,0,100,0,0],['Chips (fried snack)',536,53,7,34,2,525,0,30]];
const UN={g:1,cup:200,bowl:250,piece:50,tbsp:15,ml:1};
const grams=(f,u,q)=>u==='piece'?q*(f[7]||50):u==='cup'?q*(f[8]||200):q*UN[u];
const allFoods=()=>FOODS.concat(Object.values(S.usda).flat());

/* ---- Baseline = mean of first 3 body readings (personal baseline) ---- */
function BL(){const b=[...S.body].sort((x,y)=>x.d>y.d?1:-1).slice(0,3);if(b.length<2)return null;
 const m=k=>avg(b.map(x=>x[k]).filter(has));return{rhr:m('rhr'),hrv:m('hrv'),sleep:m('sleep'),steps:m('steps')}}
const tgtKcal=()=>{const p=S.p;let b=10*p.w+6.25*p.h-5*p.age+(p.sex==='F'?-161:5);b*=1.4;return Math.round(b+(p.goal==='lose'?-400:p.goal==='gain'?300:0))};
const dayFood=d=>S.food.filter(x=>x.d===d),sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const latestBlood=d=>[...S.blood].filter(x=>x.d<=d).sort((a,b)=>a.d<b.d?1:-1)[0];
const stress=m=>m?cl(Math.round(20+m.screen*4+m.switches*.15+m.night*.3+(3-m.mood)*8),0,100):null;

/* ---- Explainable score: base 70 + signed factor contributions (SHAP-style additive) ---- */
function scoreFor(d){const F=[],add=(n,p,w)=>F.push({n,p:Math.round(p*10)/10,w}),base=BL();
 const b=S.body.find(x=>x.d===d);
 if(b){
  if(base&&has(b.rhr)&&has(base.rhr)){const df=b.rhr-base.rhr;add('Resting heart rate',cl(-df*.75,-8,6),`Resting heart rate is ${Math.abs(df).toFixed(0)} bpm ${df>=0?'above':'below'} your baseline (${base.rhr.toFixed(0)} bpm).`)}
  if(base&&has(b.hrv)&&has(base.hrv)){const r=b.hrv/base.hrv-1;add('HRV',cl(r*20,-8,6),`HRV is ${Math.abs(r*100).toFixed(0)}% ${r>=0?'higher':'lower'} than your baseline (${base.hrv.toFixed(0)} ms).`)}
  if(has(b.sleep))add('Sleep',cl((b.sleep-7)*3+(has(b.sq)?(b.sq-3)*1.5:0),-10,5),`You slept ${b.sleep} h (target 7-9 h).`);
  if(has(b.steps))add('Steps',cl((b.steps-7000)/1000*1.2,-6,6),`${b.steps} steps vs a 7,000 reference.`);
  if(has(b.spo2))add('SpO2',b.spo2<95?-(95-b.spo2)*2:1,`Blood oxygen is ${b.spo2}% (normal ≥95%).`);
  if(has(b.act))add('Activity minutes',cl((b.act-30)/10,-3,4),`${b.act} active minutes (goal 30+).`)}
 const fo=dayFood(d);
 if(fo.length){const k=sum(fo,'kcal'),t=tgtKcal(),na=sum(fo,'na'),su=sum(fo,'sug');
  add('Calories',-Math.min(5,Math.abs(k-t)/t*12),`Intake ${Math.round(k)} kcal vs target ${t} kcal.`);
  add('Sodium',na>2000?-Math.min(5,(na-2000)/400):1,`Sodium ${Math.round(na)} mg (limit ~2000 mg for heart health).`);
  add('Sugar',su>50?-Math.min(5,(su-50)/10):1,`Sugar ${Math.round(su)} g (aim below 50 g).`)}
 const bl=latestBlood(d);
 if(bl){
  const useM=!!(window.WS_MODEL&&has(bl.sys)&&has(bl.tc)&&has(bl.glu));if(useM)modelFactors(bl,add);
  if(has(bl.ldl))add('LDL cholesterol',bl.ldl>=160?-8:bl.ldl>=130?-6:bl.ldl>=100?-3:2,`LDL is ${bl.ldl} mg/dL (optimal <100).`);
  if(has(bl.hdl))add('HDL cholesterol',bl.hdl<40?-4:bl.hdl>=60?3:0,`HDL is ${bl.hdl} mg/dL (higher is protective).`);
  if(has(bl.tg))add('Triglycerides',bl.tg>=200?-5:bl.tg>=150?-3:1,`Triglycerides ${bl.tg} mg/dL (normal <150).`);
  if(has(bl.glu)&&!useM)add('Fasting glucose',bl.glu>=126?-6:bl.glu>=100?-3:1,`Fasting glucose ${bl.glu} mg/dL (normal <100).`);
  if(has(bl.a1c))add('HbA1c',bl.a1c>=6.5?-6:bl.a1c>=5.7?-3:1,`HbA1c ${bl.a1c}% (normal <5.7%).`);
  if(has(bl.sys)&&!useM)add('Blood pressure',bl.sys>=140?-7:bl.sys>=130?-4:bl.sys>=120?-1:2,`BP ${bl.sys}/${bl.dia||'?'} mmHg (normal <120/80).`)}
 const m=S.mind.find(x=>x.d===d);
 if(m){add('Mood',(m.mood-3)*2.5,`Mood check-in ${m.mood}/5.`);const st=stress(m);add('Stress estimate',-(st-40)/8,`Estimated stress ${st}/100 from phone-usage signals (indicative only).`)}
 const tot=cl(Math.round(75+F.reduce((s,f)=>s+f.p,0)),0,100);return{score:tot,F,n:F.length}}
/* Trained model (training/train.py -> model-data.js). Linear model: coef*(x-mean)/std is the exact SHAP value per feature. */
function modelFactors(bl,add){const M=window.WS_MODEL,v={age:S.p.age,sex:S.p.sex==='M'?1:0,trestbps:bl.sys,chol:bl.tc,fbs:bl.glu>120?1:0},
 N={age:'Age (model)',sex:'Sex (model)',trestbps:'Blood pressure (model)',chol:'Total cholesterol (model)',fbs:'Fasting glucose (model)'};
 M.features.forEach((f,i)=>{const lp=M.coef[i]*(v[f]-M.mean[i])/M.std[i];add(N[f],(f==='age'||f==='sex')?cl(-lp*8,-3,3):cl(-lp*8,-8,8),`Trained heart-risk model: ${f==='fbs'?'glucose '+bl.glu:f==='sex'?'sex':N[f].replace(' (model)','').toLowerCase()+' '+v[f]} shifts risk by ${lp>=0?'+':''}${lp.toFixed(2)} (log-odds) vs an average patient.`)})}
const recOf=n=>REC[n]||REC[n.replace(' (model)','')]||'Not modifiable. Focus on the other factors.';
const REC={'Resting heart rate':'Prioritise recovery today: hydrate, limit caffeine, do 10 min slow breathing.','HRV':'Low HRV suggests under-recovery. Aim for an early night and a light activity day.','Sleep':'Fix a consistent bedtime; target 7-9 h and avoid screens 1 h before bed.','Steps':'Add two 15-minute walks (after lunch and dinner).','SpO2':'Repeated SpO2 below 95% deserves a doctor visit.','Activity minutes':'Build up to 30 min brisk activity daily.','Calories':'Adjust portions toward your calorie target.','Sodium':'Cut pickles, papad, packaged snacks and added salt.','Sugar':'Swap sweets/sweet tea for fruit or unsweetened options.','LDL cholesterol':'Reduce fried/ghee-heavy food; add oats, nuts, legumes; discuss with your doctor.','HDL cholesterol':'Regular aerobic exercise and healthy fats (nuts, fish) can raise HDL.','Triglycerides':'Limit refined carbs, sugar and alcohol.','Fasting glucose':'Prefer whole grains/millets; walk after meals.','HbA1c':'Follow up with a clinician on blood sugar control.','Blood pressure':'Reduce salt, manage stress, and recheck BP regularly.','Mood':'Take a short walk or talk to someone you trust.','Stress estimate':'Reduce late-night screen use and app-switching; schedule breaks.'};

/* ---- Small SVG chart helpers (no external libs) ---- */
function line(v,l,col='#0f9d8f'){v=v.map(x=>has(x)?+x:null);const ok=v.filter(has);if(ok.length<2)return'<div class="em">Not enough data yet</div>';
 const W=340,H=130,mn=Math.min(...ok),mx=Math.max(...ok),r=mx-mn||1,X=i=>20+i*(W-30)/(v.length-1),Y=x=>H-22-(x-mn)/r*(H-40);
 let pts=v.map((x,i)=>has(x)?X(i)+','+Y(x):null).filter(Boolean).join(' ');
 return`<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5"/>${v.map((x,i)=>has(x)?`<circle cx="${X(i)}" cy="${Y(x)}" r="3" fill="${col}"/>`:'').join('')}<text x="2" y="${Y(mx)+3}">${Math.round(mx)}</text><text x="2" y="${Y(mn)+3}">${Math.round(mn)}</text><text x="20" y="${H-5}">${l[0]}</text><text x="${W-45}" y="${H-5}">${l[l.length-1]}</text></svg>`}
function ring(p,col,txt,sub){const R=48,C=2*Math.PI*R;return`<svg viewBox="0 0 120 120" width="120"><circle cx="60" cy="60" r="${R}" fill="none" stroke="rgba(128,150,170,.3)" stroke-width="11"/><circle cx="60" cy="60" r="${R}" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C*cl(p,0,1)} ${C}" transform="rotate(-90 60 60)"/><text x="60" y="62" text-anchor="middle" style="font-size:22px;font-weight:700;fill:currentColor">${txt}</text><text x="60" y="78" text-anchor="middle">${sub}</text></svg>`}
function shap(F){if(!F.length)return'<div class="em">Add data to see factor contributions</div>';const s=[...F].sort((a,b)=>Math.abs(b.p)-Math.abs(a.p)),H=s.length*26+8,mid=190,sc=140/Math.max(8,...s.map(f=>Math.abs(f.p)));
 return`<svg viewBox="0 0 340 ${H}" width="100%"><line x1="${mid}" x2="${mid}" y1="0" y2="${H}" stroke="#889" />${s.map((f,i)=>{const w=Math.abs(f.p)*sc,y=i*26+4;return`<rect x="${f.p>=0?mid:mid-w}" y="${y}" width="${Math.max(w,1)}" height="18" rx="4" fill="${f.p>=0?'#16a34a':'#dc2626'}"/><text x="${f.p>=0?mid-4:mid+4}" y="${y+13}" text-anchor="${f.p>=0?'end':'start'}">${f.n}</text><text x="${f.p>=0?mid+w+3:mid-w-3}" y="${y+13}" text-anchor="${f.p>=0?'start':'end'}" style="fill:currentColor">${f.p>0?'+':''}${f.p}</text>`}).join('')}</svg>`}
const flag=(v,lo,hi,rev)=>!has(v)?'':(rev?(v<lo?['High risk','er']:v<hi?['Borderline','wa']:['Normal','ok']):(v>=hi?['High','er']:v>=lo?['Borderline','wa']:['Normal','ok']));
const chip=f=>f?`<span class="chip ${f[1]}">${f[0]}</span>`:'';
const fld=(id,l,t='number',v='',x='')=>`<div><label for="${id}">${l}</label><input id="${id}" type="${t}" ${t==='number'?'inputmode="decimal" step="any"':''} value="${v??''}" ${x}></div>`;
const days=n=>Array.from({length:n},(_,i)=>dstr(n-1-i));

/* ---- Demo data (flagged demo:1 so it can be toggled off) ---- */
function loadDemo(){clearDemo();S.demo=true;const D=1;
 days(30).forEach((d,i)=>{const bad=i>=27;S.body.push({d,demo:D,hr:rnd(68,88),rhr:rnd(60,64)+(bad?7:0),hrv:rnd(48,58)-(bad?14:0),steps:rnd(5500,10500),sleep:+(rnd(60,80)/10-(bad?1.2:0)).toFixed(1),sq:rnd(3,5)-(bad?1:0),spo2:rnd(96,99),act:rnd(20,60)});
  S.mind.push({d,demo:D,mood:cl(rnd(3,5)-(bad?1:0),1,5),screen:+(rnd(30,70)/10).toFixed(1),switches:rnd(60,160),typing:rnd(35,55),night:rnd(5,60)+(bad?40:0)})});
 const ex=[['Idli',3,'piece','breakfast'],['Sambar',1,'bowl','breakfast'],['Steamed rice',1,'bowl','lunch'],['Dal (cooked)',1,'bowl','lunch'],['Roti (chapati)',2,'piece','dinner'],['Chicken curry',1,'bowl','dinner'],['Apple',1,'piece','snack'],['Tea with milk & sugar',1,'cup','snack']];
 days(7).forEach(d=>ex.forEach(e=>addFood(FOODS.find(f=>f[0]===e[0]),e[1],e[2],e[3],d,D)));
 S.blood.push({d:dstr(75),demo:D,tc:218,ldl:142,hdl:41,tg:176,glu:104,a1c:5.8,sys:134,dia:86,hb:13.4},{d:dstr(35),demo:D,tc:205,ldl:128,hdl:44,tg:158,glu:99,a1c:5.7,sys:130,dia:84,hb:13.6},{d:dstr(3),demo:D,tc:192,ldl:116,hdl:48,tg:140,glu:96,a1c:5.6,sys:126,dia:82,hb:13.8});save()}
const clearDemo=()=>{['food','body','blood','mind'].forEach(k=>S[k]=S[k].filter(x=>!x.demo));S.demo=false};
function addFood(f,q,u,meal,d,demo){const g=grams(f,u,q),k=g/100;S.food.push({d,meal,name:f[0],g:Math.round(g),kcal:f[1]*k,c:f[2]*k,p:f[3]*k,f:f[4]*k,sug:f[5]*k,na:f[6]*k,demo})}

/* ---- Views ---- */
const hdr=(t,back)=>`<div class="r sp"><h1>${t}</h1>${back?`<button class="s sm np" onclick="go('${back}')">Back</button>`:''}</div>`;
function home(){const d=today(),r=scoreFor(d),y=scoreFor(dstr(1)),col=r.score>=75?'#16a34a':r.score>=55?'#d97706':'#dc2626';
 const b=S.body.find(x=>x.d===d)||[...S.body].sort((a,b)=>a.d<b.d?1:-1)[0],fo=dayFood(d),m=S.mind.find(x=>x.d===d),bl=latestBlood(d),al=alerts();
 const wk=days(7).map(x=>scoreFor(x).score);
 return`<div class="r sp"><h1>Hi, ${esc(S.p.name)} 👋</h1><button class="s sm" onclick="go('set')">⚙ Settings</button></div>
 <div class="c hd"><div class="r sp"><div><div class="mu" style="color:#cfe">Cardiac Wellness Score</div><div class="big">${r.score}/100</div><div style="font-size:13px">${r.n?`Based on ${r.n} signals today`:'Add today\'s data for an accurate score'}${y.n&&r.n?` · ${r.score-y.score>=0?'▲':'▼'} ${Math.abs(r.score-y.score)} vs yesterday`:''}</div></div>${ring(r.score/100,'#fff',r.score,'score')}</div><button class="full" style="background:#fff;color:#0b2540" onclick="go('ins')">Why this score? →</button></div>
 <div class="c"><h2>Key metrics</h2><div class="g2"><div>❤️ RHR <b>${b?.rhr??'–'}</b> bpm</div><div>〰 HRV <b>${b?.hrv??'–'}</b> ms</div><div>👟 Steps <b>${b?.steps??'–'}</b></div><div>😴 Sleep <b>${b?.sleep??'–'}</b> h</div><div>🔥 Calories <b>${Math.round(sum(fo,'kcal'))}</b>/${tgtKcal()}</div><div>🙂 Mood <b>${m?m.mood+'/5':'–'}</b></div><div>🩸 LDL <b>${bl?.ldl??'–'}</b></div><div>💓 BP <b>${bl?.sys?bl.sys+'/'+bl.dia:'–'}</b></div></div></div>
 <div class="c"><h2>Alerts</h2>${al.length?al.map(a=>`<div class="al">${a}</div>`).join(''):'<div class="mu">No alerts. Keep it up!</div>'}</div>
 <div class="c"><h2>Weekly score trend</h2>${line(wk,days(7).map(x=>x.slice(5)))}</div>`}
function alerts(){const A=[],d=today(),b=[...S.body].sort((a,b)=>a.d<b.d?1:-1)[0],bl=latestBlood(d),base=BL();
 if(b&&base&&b.rhr-base.rhr>=6)A.push(`Resting heart rate is ${Math.round(b.rhr-base.rhr)} bpm above your baseline.`);
 if(b&&b.spo2<94)A.push('Low SpO2 reading. Recheck; seek care if it persists.');
 if(b&&b.sleep<6)A.push('Short sleep detected (<6 h).');
 if(bl){if(bl.ldl>=130)A.push('LDL cholesterol is high.');if(bl.sys>=130)A.push('Blood pressure is elevated.');if(bl.glu>=100)A.push('Fasting glucose above normal.')}
 const k=sum(dayFood(d),'na');if(k>2000)A.push('Sodium intake today exceeds 2000 mg.');return A}

 p.need(40);p.text(40,'Recommendations',12,1);p.y-=16;const neg=F.filter(x=>x.p<0);if(neg.length)neg.forEach(x=>p.para(`- ${x.n}: ${recOf(x.n)}`,9));else p.para('No negative factors today. Maintain your routine.',9);p.gap(6);
 if(bl){p.need(60);p.text(40,`Latest blood report (${bl.d})`,12,1);p.y-=16;p.para(`Total chol ${bl.tc??'-'}, LDL ${bl.ldl??'-'}, HDL ${bl.hdl??'-'}, TG ${bl.tg??'-'}, glucose ${bl.glu??'-'}, HbA1c ${bl.a1c??'-'}, BP ${bl.sys??'-'}/${bl.dia??'-'}, Hb ${bl.hb??'-'}`,9);p.gap(6)}
 const m=window.WS_MODEL&&WS_MODEL.metrics;if(m){p.need(40);p.text(40,'Model note',12,1);p.y-=16;p.para(m.synthetic_data?'WARNING: the heart-risk model was trained on SYNTHETIC stand-in data. Retrain on real data before relying on it.':`Heart-risk model: logistic regression on ${m.rows} records, test AUC ${m.test_auc}, accuracy ${m.test_accuracy}. Population-level estimate, not a diagnosis.`,9)}
 p.gap(10);p.para('Not a medical device. WellSense provides indicative wellness information only and does not diagnose, treat or prevent any disease. Consult a doctor for medical decisions.',8);
 return p.build()}

 <div class="c"><h2>PIN lock</h2>${fld('pin','4-digit PIN','password','',`maxlength="4" inputmode="numeric"`)}<div class="err" id="pe"></div><button class="full" onclick="setPin()">Set PIN</button>${S.pin?'<button class="s full" onclick="S.pin=null;save();render()">Remove PIN</button>':''}</div>
 <div class="c"><h2>USDA FoodData Central (optional)</h2>${fld('uk','API key','text',S.usdaKey)}<button class="full" onclick="S.usdaKey=$('#uk').value.trim();save();render()">Save key</button><div class="mu">Needs internet. Results are cached for offline reuse.</div></div>
 <div class="c"><h2>Data</h2><button class="s full" onclick="expJSON()">Export all data (JSON)</button><button class="d full" onclick="if(confirm('Delete ALL data and profile?')){localStorage.removeItem(K);S=null;render()}">Reset / clear all data</button></div>
 <div class="c"><h2>Heart-risk model</h2><div class="mu">${window.WS_MODEL?(WS_MODEL.metrics.synthetic_data?'⚠ Trained on SYNTHETIC stand-in data. Retrain on real data with training/train.py.':'Trained on '+WS_MODEL.metrics.rows+' records.')+' Test AUC '+WS_MODEL.metrics.test_auc+'. Features: age, sex, BP, cholesterol, glucose.':'No model loaded; rule-based scoring only.'}</div></div><div class="c"><h2>About</h2><div class="mu">WellSense v1.0, explainable multimodal wellness monitoring (B.Tech seminar CDQ 413). All data stays on this device. Scores use transparent rule-based weighting compared with your own baseline.<br><b>Not a medical device.</b> It does not diagnose, treat or prevent any disease. Wearable and phone signals can be simulated.</div></div>`}
function setPin(){const p=$('#pin').value;if(!/^\d{4}$/.test(p)){$('#pe').textContent='PIN must be exactly 4 digits.';return}S.pin=btoa(p);save();render()}

function onboard(){$('#app').innerHTML=`<main><h1 style="color:var(--pr)">WellSense</h1><div class="mu">Explainable AI for personalised wellness. Create your local profile. Data never leaves this device.</div><div class="c" style="margin-top:12px">${fld('nm','Name','text')}<div class="g2">${fld('ag','Age')}<div><label>Sex</label><select id="sx"><option value="M">Male</option><option value="F">Female</option></select></div>${fld('ht','Height (cm)')}${fld('wt','Weight (kg)')}</div><label>Goal</label><select id="gl"><option value="maintain">Maintain health</option><option value="lose">Lose weight</option><option value="gain">Gain weight</option></select>${fld('pn','Optional 4-digit PIN','password','','maxlength="4" inputmode="numeric"')}<div class="err" id="oe"></div><button class="full" onclick="doOnb()">Get started</button></div></main>`}
function doOnb(demo){const n=$('#nm').value.trim(),a=num('ag'),h=num('ht'),w=num('wt'),pn=$('#pn').value,e=$('#oe');
 if(!n)return e.textContent='Please enter your name.';if(!(a>=10&&a<=100))return e.textContent='Age must be 10-100.';if(!(h>=100&&h<=230))return e.textContent='Height must be 100-230 cm.';if(!(w>=25&&w<=250))return e.textContent='Weight must be 25-250 kg.';if(pn&&!/^\d{4}$/.test(pn))return e.textContent='PIN must be 4 digits.';
 S=blank({name:n,age:a,sex:$('#sx').value,h,w,goal:$('#gl').value});if(pn)S.pin=btoa(pn);if(demo)loadDemo();save();render()}
function lock(){$('#app').innerHTML=`<main style="text-align:center;padding-top:80px"><h1>🔒 WellSense</h1><div class="mu">Enter your PIN</div><div class="c" style="margin-top:16px"><input id="lp" type="password" maxlength="4" inputmode="numeric" style="text-align:center;font-size:24px" oninput="if(this.value.length==4){if(btoa(this.value)===S.pin){locked=false;render()}else{$('#le2').textContent='Wrong PIN';this.value=''}}"><div class="err" id="le2"></div></div></main>`}

const go=t=>{tab=t;scrollTo(0,0);render()};
function render(){document.documentElement.dataset.t=S?.dark?'d':'l';if(!S||!S.p)return onboard();if(locked)return lock();
 const N=[['home','🏠','Home'],['food','🍎','Nutrition'],['body','💓','Body'],['mind','🧠','Mind'],['ins','📊','Insights']];
 const V={home,food,body,mind,ins,set,rep};$('#app').innerHTML=`<main>${V[tab]()}</main><nav>${N.map(n=>`<a class="${tab===n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</a>`).join('')}</nav>`}
if(typeof document!=='undefined'){locked=!!(S&&S.pin);render();if(S&&S.p&&!locked)syncUsage(true);if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{})}
